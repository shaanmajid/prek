name: "Publish prek-action known versions"

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      plan:
        required: false
        type: string
      expected-tag:
        description: Release tag that must be included in the update
        required: false
        type: string
    secrets:
      PREK_ACTION_TOKEN:
        required: true

permissions: {}

# All releases update the same branch in prek-action.
concurrency:
  group: publish-prek-action
  cancel-in-progress: false

env:
  ACTIONS_CACHE_MODE: none

jobs:
  publish:
    name: Publish prek-action known versions
    runs-on: ubuntu-latest
    environment:
      name: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: j178/prek-action
          ref: main
          token: ${{ secrets.PREK_ACTION_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: ""
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Update known versions
        id: refresh
        env:
          GITHUB_TOKEN: ${{ secrets.PREK_ACTION_TOKEN }}
          EXPECTED_RELEASE_TAG: ${{ inputs.expected-tag }}
        run: |
          npm run update-known-versions

      - name: Check whether known version files changed
        id: changes
        run: |
          if git diff --quiet -- version-manifest.json src/known-checksums.ts; then
            echo "known_versions_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "known_versions_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        if: steps.changes.outputs.known_versions_changed == 'true'
        run: npm test

      - name: Rebuild dist
        if: steps.changes.outputs.known_versions_changed == 'true'
        run: npm run bundle

      - name: Create pull request
        id: cpr
        if: steps.changes.outputs.known_versions_changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.PREK_ACTION_TOKEN }}
          add-paths: |
            version-manifest.json
            src/known-checksums.ts
            dist/index.cjs
          branch: automation/update-known-versions
          base: main
          commit-message: ${{ steps.refresh.outputs.pr_title }}
          title: ${{ steps.refresh.outputs.pr_title }}
          body: |
            Automated update from the prek release workflow.

            Added releases:
            ${{ steps.refresh.outputs.added_versions_markdown }}

      - name: Wait for checks and merge pull request
        if: steps.cpr.outputs.pull-request-number != ''
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ secrets.PREK_ACTION_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          PR_HEAD_SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
        shell: bash
        run: |
          # Checks can appear gradually. Wait for the complete CI workflow,
          # including its platform matrix, before considering the PR checks.
          run_id=""
          for ((attempt = 0; attempt < 60; attempt++)); do
            run_id=$(gh run list --repo j178/prek-action --workflow ci.yml \
              --event pull_request --commit "$PR_HEAD_SHA" --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty')
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 10
          done
          if [[ -z "$run_id" ]]; then
            echo "No CI run appeared for $PR_HEAD_SHA" >&2
            exit 1
          fi
          conclusion=""
          for ((attempt = 0; attempt < 120; attempt++)); do
            result=$(gh run view "$run_id" --repo j178/prek-action \
              --json status,conclusion)
            if [[ $(jq -r '.status' <<< "$result") == completed ]]; then
              conclusion=$(jq -r '.conclusion' <<< "$result")
              break
            fi
            sleep 10
          done
          if [[ "$conclusion" != success ]]; then
            echo "CI run $run_id did not succeed: ${conclusion:-timed out}" >&2
            exit 1
          fi
          gh pr checks "$PR_NUMBER" --repo j178/prek-action --watch --fail-fast
          gh pr merge --squash --repo j178/prek-action \
            --match-head-commit "$PR_HEAD_SHA" "$PR_NUMBER"
